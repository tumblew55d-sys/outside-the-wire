  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">

  <title>Outside the Wire Character Generator - Military RPG Character Creator</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Drops stale service-worker caches when a new build is deployed (Hive/IndexedDB data is left alone).
    (async function () {
      try {
        const res = await fetch('main.dart.js', { method: 'HEAD', cache: 'no-store' });
        const id = res.headers.get('etag') || res.headers.get('last-modified');
        if (!id) return;
        const prev = localStorage.getItem('otw_build_id');
        localStorage.setItem('otw_build_id', id);
        if (prev && prev !== id) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
          for (const k of await caches.keys()) await caches.delete(k);
          location.reload();
        }
      } catch (e) {}
    })();
  </script>
</head>

  <script src="flutter_bootstrap.js" async></script>
