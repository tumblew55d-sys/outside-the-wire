# Custom secret scanning configuration
# Suppress false positives for Firebase API keys (they're designed to be public)

# Note: As of 2026, GitHub may have different configuration options
# This file helps document that Firebase API keys are intentionally committed

# Firebase API keys are NOT secrets in the traditional sense:
# - They identify which Firebase project to connect to
# - Security comes from Firebase Security Rules, not hiding the keys
# - Keys should be restricted in Google Cloud Console to specific platforms
# - This is documented Firebase best practice

# If GitHub provides exclusion patterns in the future, add them here
# For now, this file serves as documentation for security reviewers
