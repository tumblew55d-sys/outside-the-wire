<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#e8e2d6" />
  <text x="40" y="60" font-size="28" font-family="Arial" fill="#2b2b2b">Patrol — Dashboard (Roster)</text>
  <rect x="40" y="90" width="520" height="620" fill="#f6f3ee" stroke="#bfb6a8" stroke-width="2"/>
  <text x="60" y="120" font-size="16" font-family="Arial" fill="#555">Roster — Personnel Folders (stack view)</text>
  <!-- three folder cards -->
  <rect x="70" y="150" width="420" height="120" rx="6" fill="#fdf6e3" stroke="#c9bfae" />
  <rect x="90" y="170" width="380" height="100" rx="4" fill="#fffefb" stroke="#d6cec0" />
  <rect x="90" y="280" width="380" height="100" rx="4" fill="#fffefb" stroke="#d6cec0" opacity="0.9"/>
  <rect x="90" y="410" width="380" height="100" rx="4" fill="#fffefb" stroke="#d6cec0" opacity="0.8"/>
  <text x="110" y="200" font-size="18" font-family="Arial" fill="#333">Cpl. A. Reyes — Patrol Folder</text>
  <text x="110" y="320" font-size="18" font-family="Arial" fill="#333">Sgt. L. Morgan — Patrol Folder</text>
  <text x="110" y="450" font-size="18" font-family="Arial" fill="#333">Pvt. R. Kim — Patrol Folder</text>
  <rect x="600" y="90" width="540" height="620" fill="#f7f7f5" stroke="#bdb5a6"/> 
  <text x="620" y="120" font-size="16" font-family="Arial" fill="#555">Selected dossier preview</text>
  <rect x="620" y="140" width="240" height="300" fill="#eae0d0" stroke="#c8b8a0"/>
  <text x="640" y="200" font-size="14" font-family="Arial" fill="#333">Photo / Portrait</text>
  <rect x="880" y="140" width="240" height="300" fill="#efe8db" stroke="#c8b8a0"/>
  <text x="900" y="200" font-size="14" font-family="Arial" fill="#333">Key Stats</text>
</svg>
